<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
    <div th:fragment="header(brandName, userRole)">
        <div class="topbar">
            <span class="brand" th:text="${brandName}">ParcelFlow</span>
            <div class="topbar-left">
                <span class="text-muted" th:text="${userRole}">Rôle</span>
                <form method="post" th:action="@{/logout}" style="display:inline;">
                    <button type="submit" class="icon-btn" title="Déconnexion">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
