            <a th:href="@{/admin/historique}" th:class="'app-nav-item' + (${active == 'historique'} ? ' active' : '')">

    <div class="app-sidebar-footer">
        <span class="dot"></span>
        Réseau urbain — 99.4%
    </div>

<!-- ============ TOPBAR ============ -->
<header th:fragment="topbar(role, username)" class="app-topbar">
    <div class="app-topbar-brand">
        <img th:src="@{/images/logo-icon.png}" alt="Livreur" style="width:22px; height:auto;">
        Livreur
    </div>

    <div class="app-search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Numéro de colis, coursier, zone..." disabled title="Recherche à venir">
    </div>

    <div class="app-topbar-actions">
        <button type="button" class="app-icon-btn" title="Notifications (à venir)" disabled>
            <span class="ping"></span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
        <a href="#" class="app-icon-btn" title="Aide">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </a>
        <form method="post" th:action="@{/logout}" style="display:inline;">
            <button type="submit" class="app-avatar" title="Se déconnecter" th:text="${username != null ? #strings.substring(username,0,1) : 'U'}">U</button>
        </form>
    </div>
</header>

    <th:block th:if="${role == 'client'}">

            Track

    </th:block>

    <th:block th:if="${role == 'livreur'}">
