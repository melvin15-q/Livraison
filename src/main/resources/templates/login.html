<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParcelFlow — Connexion</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="page">

    <div class="topbar">
        <span class="brand">ParcelFlow</span>
        <a class="icon-btn" href="#" aria-label="Aide">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </a>
    </div>

    <div class="auth-header">
        <div class="brand-mark">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        </div>
        <h1>Connexion</h1>
        <p>Bienvenue sur votre portail de logistique intelligente</p>
    </div>

    <div class="card">

        <p class="alert alert-error" th:if="${param.error}">Email ou mot de passe incorrect.</p>
        <p class="alert alert-success" th:if="${param.logout}">Vous avez été déconnecté.</p>
        <p class="alert alert-success" th:if="${param.registered}">Compte créé, vous pouvez vous connecter.</p>

        <form method="post" th:action="@{/login}">

            <div class="field">
                <label for="email">Adresse email</label>
                <div class="input-wrap">
                    <span class="field-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>
                    </span>
                    <input id="email" type="email" name="email" placeholder="alex@parcelflow.com" required autofocus>
                </div>
            </div>

            <div class="field">
                <div class="field-row">
                    <label for="password">Mot de passe</label>
                    <a class="link-small" href="#">Mot de passe oublié ?</a>
                </div>
                <div class="input-wrap">
                    <span class="field-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </span>
                    <input id="password" type="password" name="password" placeholder="••••••••" required>
                    <button type="button" class="toggle-eye" data-target="password" aria-label="Afficher le mot de passe">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <div class="checkbox-row">
                <input type="checkbox" id="remember-me" name="remember-me">
                <label for="remember-me">Se souvenir de moi</label>
            </div>

            <button type="submit" class="btn-primary">
                Se connecter
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
            </button>
        </form>

        <div class="divider">OU</div>

        <div class="oauth-row">
            <button type="button" class="btn-oauth" disabled title="Bientôt disponible">
                <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.25 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.85A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.09A6.6 6.6 0 0 1 5.5 12c0-.73.12-1.43.34-2.09V7.06H2.18A11 11 0 0 0 1 12c0 1.77.42 3.45 1.18 4.94l3.66-2.85z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.85c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Google
            </button>
            <button type="button" class="btn-oauth" disabled title="Bientôt disponible">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M16.365 1.43c0 1.14-.493 2.27-1.177 3.08-.744.9-2.005 1.59-3.02 1.59-.12 0-.23-.02-.3-.03-.014-.1-.04-.31-.04-.52 0-1.14.572-2.27 1.207-2.98.804-.94 2.164-1.64 3.14-1.68.023.14.036.28.036.36zm3.61 15.24c-.35.81-.52 1.17-.972 1.89-.63 1.02-1.52 2.29-2.62 2.3-.98.01-1.23-.64-2.56-.63-1.33.01-1.61.64-2.59.63-1.1-.01-1.94-1.15-2.57-2.17-1.76-2.83-1.94-6.15-.86-7.92.77-1.26 1.98-2 3.12-2 1.16 0 1.89.64 2.85.64.93 0 1.5-.64 2.85-.64 1.01 0 2.08.55 2.84 1.5-2.5 1.37-2.1 4.94.5 6.4z"/></svg>
                Apple
            </button>
        </div>

        <div class="card-footer">
            Pas encore de compte ? <a th:href="@{/register}">Créer un profil</a>
        </div>
    </div>

    <div class="legal-row">
        <a href="#">Politique de confidentialité</a>
        <a href="#">C.G.U.</a>
    </div>

</div>
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
